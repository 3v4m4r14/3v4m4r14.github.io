<div class="home-landing row justify-content-center align-items-center p-4">
  <div class="col-lg-8 col-md-10 text-center mt-4">

    <img
      src="{{ site.author.image }}"
      alt="{{ site.title | escape }}"
      class="home-profile-image wow animated zoomIn"
      data-wow-delay=".1s"
    >

    <h1 class="home-title wow animated slideInUp" data-wow-delay=".15s">{{ site.title | escape }}</h1>

    <p class="text-muted wow animated slideInUp" data-wow-delay=".15s">{{ site.description }}</p>

  </div>
</div>
